<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">How Better Call GPT works</title>
  <desc id="d">You talk; GPT Realtime hears you and relays real requests into your Claude Code session as tagged lines; Claude Code does the work; results are read back to you. Permission prompts are answered on the keyboard.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9AA0B8"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="#151A2E"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- you -->
    <circle cx="112" cy="138" r="54" fill="#FF5A5F"/>
    <path d="M112 108a14 14 0 0 1 14 14v18a14 14 0 0 1-28 0v-18a14 14 0 0 1 14-14zm-24 32a24 24 0 0 0 48 0m-24 24v12" fill="none" stroke="#FFF4DE" stroke-width="6" stroke-linecap="round"/>
    <text x="112" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#FFF4DE">You</text>
    <text x="112" y="246" text-anchor="middle" font-size="14" fill="#9AA0B8">mic + speaker</text>

    <!-- GPT Realtime -->
    <rect x="300" y="86" width="250" height="104" rx="16" fill="#0B0E1A" stroke="#7CC4FF" stroke-width="2.5"/>
    <text x="425" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#7CC4FF">GPT Realtime</text>
    <text x="425" y="156" text-anchor="middle" font-size="14" fill="#9AA0B8">Azure Voice Live · OpenAI Realtime</text>
    <text x="425" y="176" text-anchor="middle" font-size="14" fill="#9AA0B8">listens · answers small talk</text>

    <!-- Claude Code -->
    <rect x="690" y="86" width="226" height="104" rx="16" fill="#0B0E1A" stroke="#FFF4DE" stroke-width="2.5"/>
    <text x="803" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#FFF4DE">Claude Code</text>
    <text x="803" y="156" text-anchor="middle" font-size="14" fill="#9AA0B8">your session, your repo</text>
    <text x="803" y="176" text-anchor="middle" font-size="14" fill="#9AA0B8">does the work</text>

    <!-- arrows -->
    <line x1="172" y1="124" x2="292" y2="124" stroke="#9AA0B8" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="292" y1="152" x2="172" y2="152" stroke="#9AA0B8" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="232" y="114" text-anchor="middle" font-size="14" fill="#FFF4DE">you talk</text>
    <text x="232" y="174" text-anchor="middle" font-size="14" fill="#FFF4DE">it talks back</text>

    <line x1="558" y1="124" x2="682" y2="124" stroke="#9AA0B8" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="682" y1="152" x2="558" y2="152" stroke="#9AA0B8" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="620" y="114" text-anchor="middle" font-size="14" fill="#FFF4DE">“fix it” ⟨v#1⟩</text>
    <text x="620" y="174" text-anchor="middle" font-size="14" fill="#FFF4DE">progress + results</text>

    <!-- footer -->
    <rect x="300" y="228" width="616" height="40" rx="12" fill="#0B0E1A"/>
    <text x="608" y="254" text-anchor="middle" font-size="15" fill="#FFF4DE">Permission prompts stay on your keyboard. A spoken “yes” never approves.</text>
  </g>
</svg>
